spring:
  application:
    name: discount-coupons-management
  datasource:
    url: jdbc:h2:mem:discount-coupons;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  geo:
    ipwhois:
      base-url: https://ipwho.is
